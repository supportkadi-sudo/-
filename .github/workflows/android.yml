name: Android APK (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          test -d "${ANDROID_HOME:?Android SDK must exist on ubuntu-latest}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1); fi
          test -n "$SDKMANAGER" && test -f "$SDKMANAGER"
          bash "$SDKMANAGER" --licenses < /dev/null >/dev/null
          bash "$SDKMANAGER" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'platforms;android-35' 'build-tools;35.0.0'
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Install Godot and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Verify Android export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          ls -lah "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Android SDK paths
        run: timeout 60 godot --headless --editor --path . --script res://tests/configure_android.gd
      - name: Import resources
        run: |
          mkdir -p diagnostics
          godot --headless --editor --path . --import --quit 2>&1 | tee diagnostics/import.log
      - name: Export unsigned production-free debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          mkdir -p diagnostics
          godot --headless --verbose --path . --export-debug Android build/HookahBros-debug.apk 2>&1 | tee diagnostics/export.log
          test -s build/HookahBros-debug.apk
      - name: Verify arm64 APK contents and signature
        run: |
          python tests/verify_apk.py build/HookahBros-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/HookahBros-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build/HookahBros-debug.apk > diagnostics/apk-badging.txt
      - name: Export equivalent x86_64 build for emulator
        run: |
          cp export_presets.cfg /tmp/hookah-arm64-export.cfg
          sed -i 's@architectures/arm64-v8a=true@architectures/arm64-v8a=false\narchitectures/x86_64=true@' export_presets.cfg
          godot --headless --path . --export-debug Android build/HookahBros-emulator.apk 2>&1 | tee diagnostics/emulator-export.log
          mv /tmp/hookah-arm64-export.cfg export_presets.cfg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android install and gameplay smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: python tests/android_smoke.py
      - name: Add run summary
        if: always()
        run: |
          echo '## Hookah Bros Android build' >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the diagnostic-logs artifact if export failed.' >> "$GITHUB_STEP_SUMMARY"
          if [ -s build/HookahBros-debug.apk ]; then echo 'APK created.' >> "$GITHUB_STEP_SUMMARY"; else echo 'APK not created.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostic-logs
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HookahBros-Android-debug
          path: build/HookahBros-debug.apk
          retention-days: 14
  release:
    if: github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HookahBros-Android-debug
          path: build/
      - name: Require successful Godot validation for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            RESULT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "Godot validation" and .event == "push")] | sort_by(.id) | last | .conclusion // "pending"')
            if [ "$RESULT" = success ]; then exit 0; fi
            if [ "$RESULT" != pending ]; then echo "Godot validation: $RESULT"; exit 1; fi
            sleep 10
          done
          echo 'Timed out waiting for Godot validation'; exit 1
      - name: Publish tested prototype APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 is already published; preserving the existing release."
            exit 0
          fi
          cp build/HookahBros-debug.apk build/HookahBros-v0.1.0-arm64.apk
          sha256sum build/HookahBros-v0.1.0-arm64.apk > build/SHA256SUMS.txt
          gh release create v0.1.0 --target "$GITHUB_SHA" --title 'Hookah Bros v0.1.0 — LAN prototype' --notes-file docs/RELEASE-v0.1.0.md build/HookahBros-v0.1.0-arm64.apk build/SHA256SUMS.txt
