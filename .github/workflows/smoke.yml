name: Godot validation
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural tests
        run: python -m unittest discover -s tests -v
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Install virtual display and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libgl1
      - name: Import project and parse scripts
        run: |
          mkdir -p diagnostics
          godot --headless --editor --path . --import --quit 2>&1 | tee diagnostics/godot-import.log
      - name: Boot main scene for 60 frames
        run: godot --headless --path . --quit-after 60 2>&1 | tee diagnostics/godot-boot.log
      - name: Exercise solo gameplay, interactions and session flow
        run: godot --headless --path . --script res://tests/gameplay.gd 2>&1 | tee diagnostics/gameplay.log
      - name: Real ENet multiplayer tests
        run: python tests/run_network.py
      - name: Capture actual rendered solo gameplay
        run: xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --audio-driver Dummy --rendering-driver opengl3 --script res://tests/capture.gd 2>&1 | tee diagnostics/godot-capture.log
      - name: Reject engine and script errors in logs
        run: python tests/check_logs.py diagnostics
      - name: Upload Godot diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-diagnostic-logs
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload gameplay screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hookah-bros-screenshot
          path: artifacts/*.png
          if-no-files-found: warn
